<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trend Strategy Bot Flowcharts</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#1b2430;--mute:#5d6b7c;--line:#d7dce3;--wire:#6b778a;--acc:#2455d6;--accbg:#e6edff;
--ok:#d9f4dc;--ok-b:#2f9a47;--check:#fff3d6;--check-b:#d9a21e;--stop:#fde2e0;--stop-b:#d9534f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141b;--card:#18202b;--ink:#e6ebf2;--mute:#97a3b3;--line:#2c3746;--wire:#8b97a9;--acc:#7da2ff;--accbg:#22314f;
--ok:#1a3a20;--ok-b:#3fae55;--check:#43361a;--check-b:#d1a02a;--stop:#4a2220;--stop-b:#d65b56}}
:root[data-theme="dark"]{--bg:#0f141b;--card:#18202b;--ink:#e6ebf2;--mute:#97a3b3;--line:#2c3746;--wire:#8b97a9;--acc:#7da2ff;--accbg:#22314f;
--ok:#1a3a20;--ok-b:#3fae55;--check:#43361a;--check-b:#d1a02a;--stop:#4a2220;--stop-b:#d65b56}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit}
.top{flex:none;display:flex;align-items:center;gap:12px;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--card)}
.top h1{margin:0;font-size:1rem;white-space:nowrap}
#tabs{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;padding:2px 0}
#tabs button{flex:none;border:1px solid var(--line);background:var(--bg);padding:3px 11px;border-radius:999px;cursor:pointer;font-size:.82rem;white-space:nowrap}
#tabs button[aria-selected="true"]{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
.btn{border:1px solid var(--line);background:var(--card);padding:3px 11px;border-radius:7px;cursor:pointer;font-size:.82rem}
.btn:hover{border-color:var(--acc)}.btn.go{background:var(--acc);border-color:var(--acc);color:#fff}
.bar{flex:none;display:flex;align-items:center;gap:8px;padding:6px 12px;flex-wrap:wrap;position:relative}
.bar h2{margin:0;font-size:.98rem}
.bar .why{color:var(--mute);font-size:.82rem;flex:1 1 200px;min-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:4px 13px;cursor:pointer;font-size:.84rem}
.seg button.on{background:var(--acc);color:#fff;font-weight:600}
.pop{position:absolute;top:100%;left:12px;z-index:6;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:620px}
.pop .row{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.85rem;color:var(--mute);margin-bottom:6px}.pop b{color:var(--ink);font-size:1rem}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) var(--pw,340px);gap:8px;padding:0 12px 10px}
main.collapsed{--pw:0px;gap:0}main.collapsed #panel{display:none}
.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden}
#canvas{position:absolute;inset:0}#canvas svg{width:100%;height:100%;max-width:none!important;display:block}
.zoom{position:absolute;right:8px;top:8px;display:flex;gap:4px;z-index:3}
.zoom .btn{padding:2px 9px;background:var(--card)}
.note{position:absolute;left:8px;top:8px;z-index:3;background:var(--accbg);border:1px solid var(--acc);border-radius:8px;padding:3px 10px;font-size:.78rem}
.stepnav{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--acc);border-radius:999px;padding:5px 8px;box-shadow:0 6px 18px rgba(0,0,0,.3);max-width:96%}
.stepnav .lab{font-size:.85rem;font-weight:600;white-space:nowrap}.stepnav .nm{font-size:.82rem;color:var(--mute);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#panel{min-height:0;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:12px;font-size:.92rem}
#panel h3{margin:2px 0 6px;font-size:1.08rem}
.chip{display:inline-block;font-size:.72rem;padding:1px 9px;border-radius:999px;border:1px solid var(--line);color:var(--mute);margin-right:4px}
.chip.blue{background:var(--accbg);border-color:var(--acc);color:var(--ink)}.chip.yellow{background:var(--check);border-color:var(--check-b);color:var(--ink)}
.chip.green{background:var(--ok);border-color:var(--ok-b);color:var(--ink)}.chip.red{background:var(--stop);border-color:var(--stop-b);color:var(--ink)}
.blk{margin:10px 0}.blk h4{margin:0 0 3px;font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.blk p{margin:0}.blk ul{margin:0;padding-left:19px}.blk li{margin:2px 0}
.res{display:flex;gap:6px;align-items:baseline;margin:2px 0}
code{background:var(--bg);padding:1px 6px;border-radius:5px;font-size:.82rem;word-break:break-all}
table.nums{width:100%;border-collapse:collapse;font-size:.86rem}.nums td{padding:3px 6px;border-bottom:1px solid var(--line);vertical-align:top}.nums td:first-child{color:var(--mute);width:44%}
details.facts{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}details.facts summary{cursor:pointer;font-weight:600}
.hint{color:var(--mute);font-size:.82rem;margin-top:8px}
.pbtn{margin-top:8px;border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:8px;padding:5px 12px;cursor:pointer}
/* chart states */
#canvas .node{cursor:pointer}
#canvas .node:hover :is(rect,polygon,path,circle,ellipse){stroke-width:3.5px!important}
#canvas .node.sel :is(rect,polygon,path,circle,ellipse),#canvas .node.active :is(rect,polygon,path,circle,ellipse){stroke:var(--acc)!important;stroke-width:5px!important}
#canvas .node.active :is(rect,polygon,path,circle,ellipse){stroke-dasharray:10 4!important;animation:dash 1s linear infinite}
#canvas .node.done :is(rect,polygon,path,circle,ellipse){stroke:var(--ok-b)!important;stroke-width:3px!important}
#canvas .node.todo{opacity:.5}
#canvas .node.vis :is(rect,polygon,path,circle,ellipse){stroke:var(--acc)!important}
#canvas .node.cur :is(rect,polygon,path,circle,ellipse){stroke:var(--acc)!important;stroke-width:5px!important;stroke-dasharray:10 4!important;animation:dash 1s linear infinite}
#canvas path.flowchart-link.used{stroke:var(--acc)!important;stroke-width:3.5px!important}
@keyframes dash{to{stroke-dashoffset:-28}}
@media (prefers-reduced-motion:reduce){#canvas .node.active :is(rect,polygon,path,circle,ellipse),#canvas .node.cur :is(rect,polygon,path,circle,ellipse){animation:none}}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:9}
#modal .box{background:var(--card);border:1px solid var(--line);border-radius:12px;max-width:min(1000px,94vw);max-height:90vh;overflow:auto;padding:12px 16px}
#modal table{border-collapse:collapse;width:100%;font-size:.86rem;min-width:620px}#modal th,#modal td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left}#modal th{color:var(--mute)}
.pill{display:inline-block;padding:0 8px;border-radius:999px;font-size:.76rem;font-weight:600;border:1px solid}
.p-PASS{background:var(--ok);border-color:var(--ok-b)}.p-WEAK{background:var(--check);border-color:var(--check-b)}.p-FAIL{background:var(--stop);border-color:var(--stop-b)}
.note2{color:var(--mute);font-size:.84rem}
.chip.lbl{background:var(--ink);border-color:var(--ink);color:var(--card);font-weight:700;letter-spacing:.02em}
.goto{width:8.5em;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:7px;padding:3px 8px;font-size:.82rem}
.goto:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:var(--acc)}
@media (max-width:980px){body{overflow:auto;display:block}main{display:block}.stage{height:64vh;margin-bottom:8px}#panel{max-height:none}.top{flex-wrap:wrap}#tabs{flex-basis:100%;order:3}}
</style>
</head>
<body>
<div class="top"><h1>Trend Strategy Bot: Flowcharts</h1><nav id="tabs" aria-label="Topics"></nav><button id="theme" class="btn" type="button">Light / dark</button></div>
<div class="bar" id="bar"></div>
<main id="main">
  <div class="stage"><div id="canvas"></div><div class="zoom" id="zoom"></div><div class="note" id="note" hidden></div><div class="stepnav" id="stepnav" hidden></div></div>
  <aside id="panel" aria-live="polite"></aside>
</main>
<div id="modal"><div class="box" id="mbox"></div></div>
<script src="vendor/mermaid.min.js"></script>
<script src="vendor/svg-pan-zoom.min.js"></script>
<script>
/* ===== sizes of the symbols ===== */
const SZ={term:[128,32],io:[182,40],proc:[176,44],dec:[236,52],conn:[28,28],off:[160,38],store:[176,44]};
const KN={user:'You / outside',flow:'Main step',helper:'Helper step',check:'Check',ok:'Good result',stop:'Stop / blocked',future:'Not built yet',run:'In use today'};
const SYM=[['term','Start / End (oval)'],['io','In / out (slanted box)'],['proc','Action (box)'],['dec','Question (diamond), 2 or more answers'],['conn','Jump on this chart (circle)'],['off','Link to another chart (click to open)'],['store','Saved file']];
const n=(id,t,c,r,title,kind,d,x)=>Object.assign({id,t,c,r,title,kind,d:d||{}},x||{});
const MAPS=[];

/* ===== 1 BIG PICTURE ===== */
MAPS.push({id:'big',fold:[12,19],tab:'1. Big picture',W:200,H:68,
title:'The whole bot, start to finish',intro:'Load memory → Run → Download prices → Two searches side by side (whole market, my shares) → Each chosen share tested on its own past → Whole mix tested on past years → Look after held shares (with the expected-range check) → Check the account and the market → Rank → Risk check → Buy or wait → Save → Watch, and look again every 5 min. Opening the page only loads memory. Nothing runs until you press Run bot (or the scheduled run starts). Pentagon boxes open a bigger chart.',
nodes:[
n('s','term',1,0,'Start: open the website and pick a profile','user',{say:'You use the bot through a web page on your own PC. First you see "Who is trading?". Pick r, p or d.',points:['Each profile has its own practice money, settings, history and memory.','To start it: double-click scripts\\run_web.bat, or type python run.py web.','Address: http://127.0.0.1:8050 (you use 8060). Only your PC can open it.'],code:'run.py, tbot/web.py'},{start:1}),
n('o0','off',0,1,'More: Profiles and settings','future',{say:'Opens the profiles chart.'},{goto:'prof'}),
n('r1','proc',1,1,'Load memory: money, shares, orders, settings, limits, account stop','flow',{say:'Opening the page or picking a profile only loads memory. No run, no test and no order starts.',points:['Everything comes from that profile\'s own folder.','In the time machine (a practice trip back to a past day), only the market it was started for runs.'],code:'tbot/web.py (simple_view, switch_profile), tbot/store.py'}),
n('cfg','store',2,1,'Saved files: settings + practice account','helper',{say:'Settings and the practice account are files on your PC. One set per profile.',code:'config/, state/ (profile r), state/profiles/p2 and p3'}),
n('i1','io',1,2,'You press Run bot (or the scheduled run starts)','user',{say:'Only you start a Run. Auto run is OFF unless you turn it on.',points:['Website: press Run bot. Two clicks start one run.','Command line: type python run.py daily. Scheduled: scripts\\run_daily.bat. It always uses profile p1 (r) and does not change the website profile.','Only one run per profile at a time, website and command line together. A small "busy" file in the profile folder makes sure of this. A busy file older than 3 hours is removed.','Auto run: start the bot program with TBOT_AUTO_RUN=1. Then each new finished day starts a Run by itself.'],code:'tbot/web.py (_start_run, _run_daily), run.py, scripts/run_daily.bat, tbot/app.py (daily, run_lock); busy file: .run.lock'}),
n('p1','proc',1,3,'Stage 1: open the market settings and practice account','flow',{say:'Loads this market\'s rules, your side-panel settings and the practice account of the active profile.',points:['US and India have separate settings and separate money.','First run ever: a new account opens with your last budget. Only the latest finished day is traded.'],code:'tbot/app.py (_daily_market: mark(1), mark(2)), tbot/store.py'}),
n('d0','dec',1,4,'Is a new finished market day waiting?','check',{say:'A day counts as finished 30 minutes after the market closes. Weekends are skipped. Holidays are not known: on a holiday the Run just finds no new day.',code:'tbot/app.py (_daily_market), tbot/data.py (session_clock)'}),
n('nn','proc',2,4,'No download: use the saved prices','helper',{say:'Nothing new to download. The two searches below still run, on the saved prices, so the page is up to date.',code:'tbot/app.py (load_data with offline or current)'}),
n('yh','io',0,5,'Input: Yahoo Finance prices','user',{say:'The only data from outside.',code:'tbot/data.py'}),
n('i2','io',1,5,'Download the new daily prices','flow',{say:'Free Yahoo Finance prices, saved on your PC.',points:['A share updated in the last 15 minutes is not downloaded again. Only one download runs at a time.','If a share split, the held shares and waiting orders are adjusted (also their expected range).','Free prices can be up to 15 minutes late. Fine for practice only.'],code:'tbot/data.py (refresh, DATA_LOCK, FRESH_SECONDS), tbot/engine.py (apply_splits)'}),
n('p2','proc',1,6,'Start TWO SIDES at the same time (they only look)','flow',{say:'From here the Run works on two sides at once. Both only look: no money, order or stop changes here. On the page, step 1 and step 2 light up together (blue ring), from the price download on.',points:['Side A = page step 1, "Search whole market".','Side B = page step 2, "Search my shares".','When both are done, the Run goes on.'],code:'tbot/app.py (_daily_market: mark(3), ThreadPoolExecutor, stages.look and stages.review_held), tbot/stages.py (build)'}),
n('o2a','off',0,7,'More: Market mood','future',{say:'Opens the market mood chart.'},{goto:'mood'}),
n('sa','proc',1,7,'Side A · Search whole market: market mood (index vs its 200-day average price, fear gauge)','check',{say:'First the whole market. Index = S&P 500 (US) or Nifty 50 (India). Fear gauge = VIX or India VIX: it shows how nervous the market is. Answer: Good, Normal, extra-safe, or no buys.',points:['The bot\'s trading part checks the same again later, when it decides.','The live feed writes one MARKET line.'],code:'tbot/stages.py (look), tbot/engine.py (regime, level)'}),
n('sb','proc',2,7,'Side B · Search my shares: each held share, its strategy and its family','flow',{say:'At the same time, the other side looks at every share you already hold: which strategy bought it, and the family (group) of that strategy.',code:'tbot/stages.py (review_held), tbot/rules.py (family_label)'}),
n('sa2','proc',1,8,'Funnel 1: all shares → quick check (above the 200-day average price OR rising over 3 months, enough trading, clean data)','check',{say:'A first look, not deep. A share passes when its close is above its 200-day average price, or it rose over the last 3 months (63 market days). It also needs enough trading each day and clean price data.',points:['A share that fails is not looked at by any strategy today.','The live feed puts all skipped shares in one SKIP line, with a count per reason.'],code:'tbot/rules.py (Combo.prepare: f_quick; _signal), tbot/stages.py (look: funnel)'}),
n('sb2','proc',2,8,'Is its pattern still fine? (the same quick check)','check',{say:'Still above its 200-day average price, or still rising over 3 months? Answer: "pattern still fine", "pattern broken", or "no price today".',code:'tbot/stages.py (review_held: pattern_ok)'}),
n('o4','off',0,9,'More: Strategies','future',{say:'Opens the strategies chart.'},{goto:'strat'}),
n('sa3','proc',1,9,'Funnel 2: shares showing a pattern, in 4 families','flow',{say:'A share shows a pattern when at least one strategy\'s own buy rule says yes. Each strategy belongs to one of 4 families (groups):',points:['Breakout / new high (the price jumps above a recent high): Trend Breakout, Bollinger, New Yearly High, 100-Day High, Turtle 2, TrendPilot, Clenow TF, Longboard, SEPA, 20% Flipper.','Steady uptrend (rising calmly for a long time): Trend 200, Golden Cross, Clenow Momentum.','Momentum leader (rose more than most others): Relative, Absolute and Dual Momentum, GEM, Momentum 30, Weekly Rotation.','Dip in an uptrend (a short drop inside a longer rise): Mean Reversion, Fear Pullback.','The page counts each share once, in the family of its best strategy: "Funnel: N shares → X pass the quick check → Y show a pattern".'],code:'tbot/rules.py (FAMILIES, FAMILY_OF, family_label, Combo.families), tbot/stages.py (look, _s2)'}),
n('sb3','proc',2,9,'Is it on track, inside its expected range?','check',{say:'Each held share has an expected range for its next days (the expected-range check further down). This side reads where the share stood at the last check: "on track", "off track", or "no band yet" (no expected range yet).',points:['The live feed writes one HOLD line per held share.'],code:'tbot/stages.py (review_held, _s3), tbot/web.py (_note_held), tbot/models.py (Position pred_*)'}),
n('sa4','proc',1,10,'Funnel 3, deep check: that family\'s strategy rules (stop, target, score)','flow',{say:'The strategy that matched gives the details: its stop (the sell price if it falls), its target (the sell price if it rises, or none) and its own score. These ideas are ranked and risk-checked later.',points:['The live feed names the best 5 PASS shares, then "and N more".'],code:'tbot/rules.py (Combo.candidates, _one), tbot/web.py (_note_sorting)'}),
n('sa5','proc',1,11,'Each chosen share tested on its own past: did this strategy work on this share before?','check',{say:'For each chosen share, the bot looks back 3 years on that share. Every day the same strategy said "buy" there is one past signal. It only counts signals whose result 20 market days later is already known, so no future prices are used.',points:['Passed = at least 3 past signals, at least half of them ended higher 20 days later, and on average they made money.','A strategy can offer a share only when its buy rule says yes today AND it passed this check on that share. Not passed = that strategy does not offer it (no message).','The page shows it first in step 3, "Test past years": "Chosen shares tested on their own past: X of Y passed", with up to 5 examples (signals, how many went up, average change). Then the 10-year test of the whole mix.','Settings (US and India settings files): on, judged 20 days later, 3 years back, at least 3 signals. It is part of the strategy settings, so the 10-year test uses it too, and changing it makes the saved test out of date.'],code:'tbot/rules.py (Combo._signal, _history, history, candidates), tbot/stages.py (look: funnel tested, history; _s4); settings: strategy.history_check (enabled: true, days_after: 20, years: 3, min_signals: 3) in config/us.yaml and config/india.yaml'}),
n('j','proc',1,12,'Both sides done: findings saved, page steps 1 and 2 get a check mark','flow',{say:'What both sides found is saved for the page. The live feed then writes it, one line every 1.1 seconds on the page.',code:'tbot/app.py (save_facts), tbot/web.py (_progress: stage 4 or 5)'}),
n('dn','dec',1,13,'Is there a new market day to trade?','check',{say:'The same answer as the question before the download. No new finished day: the two searches ran on the saved prices, and that is all.',code:'tbot/app.py (_daily_market: current)'}),
n('n0','proc',2,13,'Nothing new: no test, no trading','helper',{say:'There is nothing new to trade. The last decision stays on the page.',code:'tbot/app.py (_daily_market)'}),
n('o8','off',0,14,'More: Proof','future',{say:'Opens the proof chart.'},{goto:'proof'}),
n('d1','dec',1,14,'Is the saved past-years test still good?','check',{say:'Good = made for the settings you use now, and its prices end 90 days ago or less. A good test is used again, not run again. A failed test is not run again until the settings change or it gets too old.',code:'tbot/stages.py (passport_state), tbot/web.py (_gate), tbot/app.py (test_gate, mark(4))'}),
n('p6','proc',2,14,'Run the past-years test now and WAIT','run',{say:'7 tests: 5 practice years, 5 exam years, five 2-year parts. It takes a minute or two. The website and the command line both do this.',points:['Website: the Run waits up to 30 minutes. Meanwhile the live watch, the Sell button and cash changes still work.','Website: you cannot switch profile while it waits. Start, Start again or Leave in the time machine (or Reset) first stops everything: the time machine pauses, a new "world" begins, the waiting Run stops without saving and without an error on the page, the old world\'s test stops between its 7 parts (nothing saved), and the bot waits up to 90 seconds for all of this. The next Run tests again in the new world.','A test you started yourself may already be running: step 3 then stays grey ("Next: a past-years test is already running (test k of 7); the Run uses it here") until the Run gets there.','Command line and scheduled run: the test runs first, then the Run goes on. If the test crashes: no test = no new buys.'],code:'tbot/web.py (_gate, _start_test, _wait_test, _tm_switch, _stop_everything, TestCancelled, WorldChanged), tbot/app.py (test_gate), tbot/study.py (passport)'}),
n('d2','dec',1,15,'Did the past-years test pass?','check',{say:'On the page this is step 3, "Test past years". It first lists the chosen shares tested on their own past, then this test of the whole mix. One test for all strategies together, per market.',code:'tbot/stages.py (validation_block)'}),
n('p7','proc',2,15,'NO NEW BUYS today (reason saved)','stop',{say:'The page says "Strategy not validated ..." or "Strategy did not pass the past-years test ...". Shares you already hold are still looked after and sold by their own rules.'}),
n('o5','off',0,16,'More: One market day','future',{say:'Opens the market day chart.'},{goto:'day'}),
n('p5','proc',1,16,'Look after held shares, one missed day at a time: sells and stops first','flow',{say:'The account is read again first (the live watch may have sold something). One Run catches up every finished day since the last Run. For each day:',points:['Yesterday\'s sell orders are sold at the open. Then stops and targets. Then yesterday\'s buy orders are bought or cancelled. Buys that did not go through are dropped.','After the close: when a share is up by the amount risked, its stop moves to the buy price. Then the strategy\'s own stop that follows the price up.','Then the expected-range check of each held share (next box), then the strategy\'s own sell rule.','At the end the money is measured: day, week, biggest drop from the top, losing streak.'],code:'tbot/engine.py (Engine.run, Engine.step), tbot/rules.py (Combo.manage)'}),
n('db','dec',1,17,'Expected-range check: is the held share below its expected range?','check',{say:'The bot expects each held share to keep rising, or at least stay flat. The expected range starts from the close and goes up each day along the recent trend line of the last 20 days (never down). Its lower edge is 1 normal daily move below that line. A fresh range starts every 5 market days.',points:['Inside or above the range: on track, nothing to do.','Settings (US and India settings files): on, 5 days, lower edge 1 normal daily move.','It runs after the stop is moved up and before the strategy\'s sell rule. The backtest (a test on old prices) and the past-years test use it too.','A split scales the range, like the stop.'],code:'tbot/predict.py (check), tbot/engine.py (Engine.step 4, apply_splits), tbot/rules.py (slope20); settings: strategy.predict (enabled: true, days: 5, band_atr: 1.0) in config/us.yaml and config/india.yaml'}),
n('dp','dec',2,17,'Off track: is its pattern still fine (the quick check)?','check',{say:'Still above its 200-day average price, or still rising over 3 months?',code:'tbot/predict.py (check: f_quick)'}),
n('ps','proc',3,17,'Pattern broken: stop raised to 1 normal daily move below the close (never lowered)','check',{say:'The stop moves only if the new stop is higher than the old one. Nothing is sold here: the share is just better protected.',code:'tbot/predict.py (check)'}),
n('kh','proc',2,18,'Pattern fine: keep holding (note saved)','ok',{say:'The share is below its expected range, but its pattern is still fine. Nothing changes.'}),
n('px','proc',1,18,'The strategy\'s own sell rule still decides the sale (sell at the next open)','flow',{say:'Each share follows the strategy that bought it.',code:'tbot/rules.py (exit_reason), tbot/engine.py (Engine.step 4)'}),
n('d3','dec',1,19,'Does the account allow new buys?','check',{say:'Checked in this order: test passed, account not stopped after a 5% fall, no STOP switch, day loss under 1%, week loss under 2%, no losing-streak pause.',code:'tbot/engine.py (step 6, no_buys), tbot/risk.py (account_block)'}),
n('o2','off',0,20,'More: Market mood','future',{say:'Opens the market mood chart.'},{goto:'mood'}),
n('p3','proc',1,20,'Judge the market: Good, Normal or Bad','check',{say:'Good: risk 0.5% of the money per trade. Normal: 0.25%. Bad (index under its 200-day average price): no buys, unless the switch "Buy when the index is under its 200-day average" is on. Then at most 1 tiny trade (0.1% risk) in a share that beat the index by 10 points over 3 months.',points:['Panic (fear gauge too high): no buys.','Index data missing, or fear gauge missing or older than 5 days: no buys. A fear gauge that never downloaded also counts as missing.','Normal also means fewer shares at once: 60% of the limit, so 3 of 5.'],code:'tbot/engine.py (regime, fear, level, only_below_trend), config: regime'}),
n('dm','dec',1,21,'Does the market allow buying?','check',{say:'Yes for Good and Normal. Bad with the switch on: extra-safe mode. Bad with the switch off, panic, or missing data: no. Then there is no share search at all.'}),
n('p10','proc',2,21,'Wait: no buy today (reasons saved)','stop',{say:'Every block and every dropped idea is saved with its reason. Held shares keep their stops.'}),
n('p4','proc',1,22,'Rank the ideas: strategy order first, then the strategy\'s own score','flow',{say:'Only shares from side A\'s funnel: quick check passed, a strategy rule said yes, and that strategy passed the share\'s own-past check. The mix: Trend Breakout plus the lab strategies (tested in the research lab) that are switched on (US 20, India 16).',points:['Shares already held or ordered are skipped.','How many shares are compared: Good market 20, Normal 10, Bad (extra-safe) 3.','Ranking: first the strategy order in the settings file (best 10-year result first, Trend Breakout LAST), then the strategy\'s own score, then the share name.','Each order says "rank k of n".'],code:'tbot/engine.py (_scan), tbot/rules.py (Combo.candidates), config: regime.scan, strategy.use'}),
n('o10','off',0,23,'More: Should I buy?','future',{say:'Opens the risk check chart.'},{goto:'gate'}),
n('p8','proc',1,23,'Risk check on every idea (up to 5 shares, at most 1 per strategy)','check',{say:'Checks, in order: already held or ordered, sold too recently (5-day wait), share limit (5 in total), max 3 new a day, at most 1 share per strategy, size by market level, max 10% of the money in one share, enough cash, and the trade must be able to win at least 2× what it risks, after costs (each strategy has its own target). This check can only block or shrink a trade.',points:['1 per strategy: one strategy cannot fill every seat, so every strategy gets a turn. Setting: "Shares per strategy".','Falling market (extra-safe): still at most 1 share in total.','Later picks of the same day risk half as much.'],code:'tbot/risk.py (evaluate: max_positions, per_strategy_max), config: risk'}),
n('d4','dec',1,24,'Did any idea pass the risk check?','check',{say:'Most days: no. "No trade" is a good day.'}),
n('p9','proc',1,25,'Buy order for the next open','ok',{say:'The order has a size, a stop, its strategy and a reason ("rank k of n"). It lasts one market day: if it is not bought, it is dropped. A limit buy (Fear Pullback: buy only at or under a set price) waits for its price.',code:'tbot/engine.py (_scan), tbot/broker.py (new_order)'}),
n('i3','io',1,26,'Save everything and show the 4 steps','ok',{say:'Account, trades, events and reasons are saved, with the strategy of each trade. The page shows 4 steps: Search whole market, Search my shares, Test past years, Buy or sell (stage 1 is inside step 1).',points:['The 4 steps sit in one row, with a bundle of wires between each. Steps 1 and 2 work at the same time.','Blue ring = a Run is working on this step now. Steps 1 and 2 light up together from the price download on, while both searches run. A job of the bot loop flares the reactor of step 1 or 2; a live buy or sell rings step 4 for about 6 s. Step 3 lights up only when the Run gets there. A test already running on its own keeps step 3 grey: "Next: a past-years test is already running (test k of 7); the Run uses it here".','Amber reactor (a turning amber circle): The server decides the reactor (step_modes in web.py; rules in CLAUDE.md). Step 1: the ring on the first look of a Run, then the reactor for as long as its work repeats by itself (the look-again of the auto loop; in the time machine the trip Run after each close), not a tick just because the Run ended; none with no account, auto checks off, a paused trip or after Stop. Step 2: the reactor while held shares or waiting buys need watching; none when there are none. Full speed while the market is open, calm standby while it is closed (trip clock in the time machine); a loop job flares it. Time machine: it shows while the trip runs (not paused). No reactor before the account exists, during the first look of a Run, with auto checks off, in a paused trip or after Stop.','Check mark = finished. Steps 3 and 4 never show the reactor. A grey step still says why (for example "Settings changed: tested again at the next Run").','Wires: a wire into a grey (waiting) step stays faint and still. Other wires take the colour of the step they leave. How many wires: link 1 = shares found, link 2 = shares held and profit, link 3 = the test\'s money won for every 1 lost (profit factor).','During a Run the page says "Running now · step k of 4".','The live feed shows one new line every 1.1 seconds.','Command line: report in runs/daily/latest.html, plus a Telegram message if it is set up.'],code:'tbot/store.py, tbot/stages.py (NAMES, build), tbot/web/app.html (STAGES, looping, drawWires, wireCounts), tbot/app.py (_daily_report)'}),
n('d5','dec',1,27,'Website Run: market open and buys waiting?','check',{say:'US 9:30-16:00 New York time. India 9:15-15:30 India time. Only the website Run does this last step, also when nothing was new.',code:'tbot/web.py (_run_daily, market_open_now)'}),
n('p11','proc',2,27,'Buy the waiting orders at the live price','run',{say:'Does not wait for the next open. A limit buy waits until the live price is at or below its set price.',points:['The live buy runs the same safety checks as the trading part: STOP switch, halt, day and week loss stop, losing-streak pause; on a special news day the buy is cancelled.','There is no "first or last 15 minutes" rule in the code.','Time machine: there are no live prices for the past. While the trip\'s market is open, waiting buys are bought within about 5 seconds at that day\'s opening price (only the Open is used), with the same checks. Step 4 then says "Buying X at today\'s opening price"; while the trip\'s market is closed it says "X buy when the market opens, at the opening price".'],code:'tbot/web.py (buy_live, _tm_tick, _tm_open_quotes), tbot/data.py (open_price), tbot/web/app.html (liveFor)'}),
n('o14','off',0,28,'More: Live watching','future',{say:'Opens the live chart.'},{goto:'live'}),
n('p12','proc',1,28,'Watch: the bot keeps an eye on held shares','run',{say:'While the bot program runs on your PC (the page can be closed): it checks the stop, the target and the move of the stop to the buy price, every 2 to 10 minutes when the market is open. Waiting buys every 60 seconds. These are the default times: you can change each one (side panel, Bot timers, Edit timers).',points:['Every 5 minutes it looks for a new finished day. Auto run off (normal setting): it only writes "Press Run bot".','Time machine: the live checks are off. It runs each day by itself on its own clock. Its own loop also buys waiting orders at the day\'s opening price while its market is open. Held shares are checked at each Run on the day\'s high and low (no prices inside the day for the past).'],code:'tbot/web.py (_auto_loop, watch_live, auto_tick, _tm_tick, bot_timers), tbot/timemachine.py (_drive)'}),
n('rc','proc',2,28,'Every 5 min (market open): both sides look again on live prices. They only look','run',{say:'Side A: is the index above its 200-day average price, and how many shares pass the quick check on live prices now. Side B: is each held share on track or below its expected range. Nothing is bought, sold or moved: buying stays once a day, after the close.',points:['The page: The server decides the reactor (step_modes in web.py; rules in CLAUDE.md). Step 1: the ring on the first look of a Run, then the reactor for as long as its work repeats by itself (the look-again of the auto loop; in the time machine the trip Run after each close), not a tick just because the Run ended; none with no account, auto checks off, a paused trip or after Stop. Step 2: the reactor while held shares or waiting buys need watching; none when there are none. Full speed while the market is open, calm standby while it is closed (trip clock in the time machine); a loop job flares it.','This look-again does not run while a Run is working, and not in the time machine (there the reactor follows the trip schedule).','The live feed writes one LIVE line.'],code:'tbot/web.py (recheck, bot_timers recheck: default 300 s, _auto_loop), tbot/predict.py (status), tbot/web/app.html (looping)'}),
n('e','term',1,29,'End: next finished day, press Run bot again','user',{say:'Repeat. The next Run starts from the saved memory.'})],

title:'One market day inside the bot\'s trading part',intro:'The backtest (a test on old prices), the daily run and the past-years test all use this same chart, so what you test is what runs. Each held share follows the strategy that bought it, and gets an expected-range check after the close. A Run repeats this for every missed day. The two searches (whole market, my shares) run before this, at the same time, and only look. A strategy can offer a share only if it passed that share\'s own-past check.',
nodes:[

n('p1','proc',1,2,'1. Yesterday\'s sell orders sell at today\'s open','flow',{say:'Sold at the open price, a little worse (the small price difference when buying or selling), minus costs. A share with no price today keeps its sell order for tomorrow.',code:'tbot/engine.py step 1'}),
n('d1','dec',1,3,'2. Held share: did the price touch the stop today?','check',{say:'Uses today\'s real low. The stop is checked FIRST: if both the stop and the target were touched, it counts as a loss.',points:['In the time machine this is the only stop check: held shares are checked at each Run on the day\'s high and low (no prices inside the day for the past).'],code:'tbot/broker.py (check_exit)'}),
n('p2','proc',2,3,'Sell: loss kept small','stop',{say:'If it opened below the stop, it sells at the open (can be worse).'}),
n('d2','dec',1,4,'Did the price touch the target?','check',{say:'Today\'s real high reached the target. Trend Breakout: profit target = 3 × the amount risked. Some strategies have no fixed target.'}),
n('p3','proc',2,4,'Sell: profit taken','ok',{say:'If it opened above the target, it sells at the open.'}),

n('p4','proc',2,5,'Cancel the buy (reason saved)','stop',{}),

n('p5b','proc',2,7,'Sell the same day','stop',{}),
n('pd','proc',1,8,'Drop buy orders that did not go through. Count each sale in the losing streak','helper',{say:'A buy order lasts one market day. Every sale moves the losing streak: a loss adds 1, a result of 0 or more starts the count again.',code:'tbot/engine.py, tbot/risk.py (record_trade)'}),
n('p6','proc',1,9,'4. After the close: stop moved to the buy price once up by the amount risked, then each strategy\'s stop that follows the price up','flow',{say:'Up by the amount risked (by today\'s high): the stop moves to the buy price. Trend Breakout then keeps its stop 2 normal daily moves below the highest close. Clenow TF keeps it 3 normal daily moves (measured over 20 days) below, after that. Longboard keeps it 10 normal daily moves (measured over 40 days) below the highest high, from day one. The others keep their stop.',code:'tbot/rules.py (Combo.manage), tbot/strategy.py (manage)'}),
n('db','dec',1,10,'Expected-range check: is the held share below its expected range?','check',{say:'The bot expects the share to keep rising, or at least stay flat. The range starts from a close and goes up each day along the recent trend line of the last 20 days (never down). Its lower edge is 1 normal daily move below that line. After 5 market days a fresh range starts from the close.',points:['No range yet (new share) or 5 market days done: a fresh range starts today, no check today.','Inside or above the range: "on track".','Settings: on, 5 days, lower edge 1 normal daily move.'],code:'tbot/predict.py (check), tbot/engine.py (Engine.step 4), tbot/models.py (Position pred_*); settings: strategy.predict (enabled: true, days: 5, band_atr: 1.0)'}),

n('ps','proc',3,10,'Pattern broken: stop raised to 1 normal daily move below the close (never lowered)','check',{say:'Only when that is higher than the stop now. Nothing is sold here.'}),
n('kh','proc',2,11,'Pattern fine: keep holding (note saved)','ok',{}),

n('p7','proc',2,12,'Sell at the next open','stop',{}),

/* ===== important facts shown first on every chart ===== */
const FACTS={
big:['Practice money only: no broker, no real orders.','Opening the page or picking a profile only loads memory. No run, no test, no order. Only Run bot (or the scheduled run) starts a Run. Auto run is off unless you set TBOT_AUTO_RUN=1.','After the download the Run works on TWO SIDES at the same time, and both only look. Side A, Search whole market: market mood, then the funnel: all shares → quick check → a pattern in one of 4 families → that strategy\'s rules. Side B, Search my shares: each held share, its strategy and family, is its pattern still fine, is it on track inside its expected range.','Quick check = above the 200-day average price OR rising over 3 months, plus enough trading and clean data. A buy signal now needs it too.','Each chosen share is tested on its own past: every time the same strategy said "buy" on that share in the last 3 years (only results 20 market days later that are already known). Passed = at least 3 signals, at least half ended higher, and on average they made money. A strategy offers a share only when its rule says yes today AND it passed here. It is part of the strategy settings, so the 10-year test uses it; changing it makes the saved test out of date.','The order: both searches side by side → shares chosen by the funnel → each chosen share tested on its own past → the whole strategy mix tested on 10 years (the main check) → the bot\'s trading part → buy, hold or sell.','Expected range: the bot expects a held share to rise or stay flat (along the recent trend line of the last 20 days, never down; lower edge 1 normal daily move below; a fresh range every 5 market days). Below the range: pattern fine = keep holding; pattern broken = stop raised to 1 normal daily move below the close, never lowered. The strategy\'s own sell rule still decides the sale.','The website Run and the command-line Run (run.py daily, run_daily.bat on profile p1) both run the past-years test first when it is missing, too old, or the settings changed. Not passed = no new buys.','Nothing new (no new finished day): no download; the two searches run on the saved prices; no test, no trading. One Run catches up every missed day.','Risk per trade: Good 0.5% of the money, Normal 0.25%, extra-safe 0.1%. At most 10% of the money in one share.','Up to 5 shares at a time (the project rule), at most 1 per strategy, max 3 new a day. Normal market: 3 shares. Falling market (extra-safe): still 1 share in total.','Loss stops: day -1%, week -2%. A 5% drop from the top = the whole account stops (restart on the page or with reset-halt).','Strategies: Trend Breakout plus the lab strategies switched on (US 20, India 16). Order = the order in the settings file (best 10-year lab result first), Trend Breakout last. Each share is sold by the rules of the strategy that bought it.','Page steps, 4 in one row: 1 Search whole market, 2 Search my shares, 3 Test past years (first the chosen shares on their own past, then the whole mix), 4 Buy or sell. Blue ring = a Run is working on it now (steps 1 and 2 light up together from the download on; step 3 only when the Run gets there). A job of the bot loop flares the reactor of step 1 or 2; a live buy or sell rings step 4 for about 6 s. Reactor (turning amber circle): The server decides the reactor (step_modes in web.py; rules in CLAUDE.md). Step 1: the ring on the first look of a Run, then the reactor for as long as its work repeats by itself (the look-again of the auto loop; in the time machine the trip Run after each close), not a tick just because the Run ended; none with no account, auto checks off, a paused trip or after Stop. Step 2: the reactor while held shares or waiting buys need watching; none when there are none. Full speed while the market is open, calm standby while it is closed (trip clock in the time machine); a loop job flares it. Check mark = finished (steps 3 and 4 never get the reactor). A grey step still shows its reason. A wire into a grey step stays quiet. During a Run: "Running now · step k of 4".','Time machine: a separate world for one market. It forgets everything after its date (prices cut off, no live prices, its own account and its own past-years test). Waiting buys are bought at that day\'s opening price. Start and Leave first stop everything, like Reset (clock paused, waiting Run stopped quietly, old test cancelled, up to 90 s wait); a profile switch also makes a new world.','While the bot program runs (the page can be closed), it watches held shares for the stop, the target and moving the stop to the buy price, every 2 to 10 min. Every 5 min (market open) both searches look again on live prices. They only look: buying stays once a day, after the close.','One run per profile at a time, website and command line together (a small busy file makes sure).','The live buy runs the same safety checks as the trading part: STOP switch, halt, day and week loss stop, losing-streak pause; on a special news day the buy is cancelled. There is no "first or last 15 minutes" rule (by choice).'],
lanes:['Seven parts hand work to each other: You, Website, Trading part, Two searches, Risk check, Broker (pretend), Saved account.','Only you start a Run (or Auto run, if you turn it on).','The two searches (whole market, my shares) work at the same time and only look. They run even when nothing is new, on the saved prices.','Nothing new: the Run skips the test and the trading and goes straight to the page.','The Website checks the past-years test before the trading part starts. Not passed = no new buys.','The Risk check can only block or shrink a trade, never make one. Up to 5 shares, at most 1 per strategy.','Website only: at the end, waiting buys are bought at the live price if the market is open (time machine: at that day\'s opening price).','After the Run, every 5 min (market open) both searches look again on live prices. They only look.','Every block has a written reason on the page.'],
day:['Order in one day: sells go through, stops and targets, buys go through (or are cancelled), a new buy can be sold the same day, buys that did not go through are dropped, stops moved up, expected-range check, the strategy\'s own sell rule, money measured, account check, market check, new buys.','The stop is checked FIRST when both the stop and the target were touched.','Expected-range check (after the close): below the range and pattern broken = stop raised to 1 normal daily move below the close, never lowered. Pattern fine = keep holding. It never sells by itself.','A buy is cancelled if: no price, share limit full (5), special news day, set price not reached, opened at or below the stop, a price jump overnight made the risk over 1.5×, no cash.','A BUY order lasts one market day. A SELL order with no price waits.','Account blocked, panic, missing data, or bad market (switch off): no share search at all.','A strategy can offer a share only if it passed that share\'s own-past check: at least 3 buy signals in the last 3 years, at least half higher 20 days later, money made on average.','How many shares are compared: best 20 (Good), 10 (Normal), 3 (Bad). Up to 5 shares, at most 1 per strategy; later picks of the day risk half as much.'],
mood:['Good market: 0.5% risk. Normal: 0.25%. Bad: no buys, or 0.1% (1 share that beat the index by 10 points) if the switch is on. Panic: no buys.','Index data missing, or a fear gauge missing or more than 5 days old: no buys. A fear gauge that is set but never downloaded counts as missing. No fear gauge set at all: it is not used.','Good needs: each of the last 5 days above the 200-day average price, today above the 50-day average price, and a calm fear gauge.','US fear limit: VIX above 25 (calm: 20 or lower). India: India VIX above 20 (calm: 16 or lower).','Extra-safe takes the first of 3 shares (in strategy order) that beat the index and pass the risk check. It needs the market levels switched on. At most 1 share in total.','Normal = fewer shares at once: 60% of the limit, so 3 of 5. Good = the full 5.','Side A of each Run shows the market mood on page step 1. The look-again every 5 minutes (market open) checks only the index against its 200-day average price, on the live price. It only shows.'],
gate:['The account check and the market check come first, once a day (see Safety switches).','Only shares that pass the quick check (above the 200-day average price or rising over 3 months) can get a buy signal.','Shares already held or ordered are skipped quietly.','Each chosen share is tested on its own past: a strategy offers it only if, in the last 3 years, that strategy gave at least 3 buy signals on it, at least half ended higher 20 market days later, and on average they made money. Not passed = not offered, quietly.','How many shares = money to risk ÷ (price − stop). Risk depends on the market level. Max 10% in one share. Whole shares. Never more than the free cash.','The trade must be able to win at least 2× what it risks, after costs, at each strategy\'s own target: Trend Breakout 3 × the amount risked; strategies with no target judged at 3×; strategies aiming at 2× raised by up to half the amount risked; Mean Reversion +4% (can be raised); Fear Pullback +3% (not raised).','Up to 5 shares at once (waiting buys count), at most 1 per strategy, max 3 new buys a day; later picks of the day risk half as much. After a sale, the same share waits 5 market days.','The live buy checks only the STOP switch and the account stop. In the time machine it buys at that day\'s opening price.','A waiting buy shows as "about ₹X set aside" on the page; it is not spent until it is bought.'],
trade:['Each share follows the strategy that bought it.','Trend Breakout: stop 2 normal daily moves below the signal-day close, profit target = 3 × the amount risked (measured from the buy price), stop moved to the buy price once up by the amount risked (by the day\'s high), then the stop follows the price up 2 normal daily moves below, sell if the close falls under the 20-day average price.','Others: their own stop and sell rule. Mean Reversion: +4% or sold at the 4th open. Fear Pullback: a close 3% up, or after 4 market days. Longboard\'s stop follows the price up from day one.','After the close each held share gets an expected-range check: on track = nothing; below the range and pattern fine = keep holding; pattern broken = stop raised to 1 normal daily move below the close (never lowered). The strategy\'s sell rule still decides the sale.','A sale at the buy price is a tiny loss after costs and counts as a loss.','Every sale (the bot\'s trading part, the live watch, the Sell button) starts a 5-market-day wait for that share and counts in the losing streak. 4 losses in a row pause buying for 5 market days.'],
live:['Loop: wait 20 s once, then live watch, waiting buys, "still awake" note, look-again every 5 minutes, new-day check every 5 minutes, wait 60 s, repeat.','These times are defaults. Side panel, Bot timers: live countdowns of each job; Edit timers changes them for this profile (loop 15 s to 10 min, held share quickest 30 s to 30 min and slowest 1 to 60 min, look-again 1 to 60 min, new-day check 1 to 60 min). The loop is the heartbeat: nothing runs more often than it. A save asks first; Default puts all 5 back.','The live watch only checks the stop, the target and moving the stop to the buy price. The stop that follows the price up, the expected-range check and strategy sell rules wait for the next Run and sell at the next open.','Held shares are checked every 2 min when risky, up to every 10 min when rising safely, the same gap when steady. No live price from today: WAIT, check again in 2 min.','Every 5 min (market open, no Run working) both searches look again on live prices: the index against its 200-day average price, how many shares pass the quick check now, each held share on track or below its expected range. They only look: buying stays once a day, after the close. One LIVE line in the feed; the page shows the result for up to 10 minutes.','The bot program is enough: the page can be closed. If the bot program is closed, nothing is checked during the day. TBOT_AUTO=0 turns the checks off. Only the active profile is watched.','Live buys run the same safety checks as the trading part (STOP switch, halt, day and week loss stop, losing-streak pause; cancelled on a special news day).','Auto run is OFF unless you turn it on: a new day only writes "Press Run bot".','Time machine: the live checks and the look-again are off. It runs each market day on its own clock. While its market is open, waiting buys are bought within about 5 s at that day\'s opening price. Held shares are checked at each Run on the day\'s high and low.','Live feed: memory only, last 300 lines, emptied on a switch or a restart. The page asks for new lines every 2 seconds and shows one new line every 1.1 seconds. Skipped shares come as one SKIP line; the best 5 PASS shares by name, then "and N more".','On the page each step circle shows its state. Blue ring = a Run is working on this step now: steps 1 and 2 together from the price download on, step 3 only when the Run gets there (a test already running on its own keeps step 3 grey: "Next: a past-years test is already running (test k of 7); the Run uses it here"). A job of the bot loop flares the reactor of step 1 or 2; a live buy or sell rings step 4 for about 6 s. Amber reactor (turning circle): The server decides the reactor (step_modes in web.py; rules in CLAUDE.md). Step 1: the ring on the first look of a Run, then the reactor for as long as its work repeats by itself (the look-again of the auto loop; in the time machine the trip Run after each close), not a tick just because the Run ended; none with no account, auto checks off, a paused trip or after Stop. Step 2: the reactor while held shares or waiting buys need watching; none when there are none. Full speed while the market is open, calm standby while it is closed (trip clock in the time machine); a loop job flares it. Check mark = finished (steps 3 and 4 never get the reactor).','The lines between steps are bundles of wires: green done, blue working, amber watching. A wire into a grey (waiting) step stays faint and still. Link 1 = shares found, link 2 = shares held and their profit, link 3 = the test\'s money won for every 1 lost (profit factor). The 4 steps sit in one row. A grey step still shows its reason (for example "Settings changed: tested again at the next Run"). During a Run: "Running now · step k of 4".'],
proof:['The bot judges only the 5 exam years: money won for every 1 lost (profit factor) over 1.3, biggest drop from the top under 10%, at least 30 trades. The 2-year parts are shown, not checked.','A Run checks the past-years test before new buys (website and command line). Not passed = no new buys; held shares are still looked after.','The test uses its own settings (another share list, 25,000 USD or 10 lakh rupees, 5 shares). It uses the same trading part, so also 1 share per strategy, the own-past check of each chosen share and the expected-range check. It proves the strategy and risk settings, not your account size.','You can change the pass marks in Settings; they are judged again at once. Older than 90 days = too old.','Two checks, in order: each chosen share on its own past (3 years, at least 3 signals, half up, money made on average), then the whole mix on 10 years (the main check). The own-past check is a strategy setting: changing it makes the saved test out of date.','The live result is on the page (step 3, Test past years: first "Chosen shares tested on their own past: X of Y passed", then the test of the whole mix). The bot is still in Phase 1: practice money only.','Paper trading (practice money, live prices) needs 3+ months and 100+ trades before small real money.','Time machine honesty: the trip hides every price after its date and makes its own test. But the strategy list and order and the share list were chosen with 2016 to 2026 knowledge (today\'s share lists leave out shares that failed since). So a trip still looks better than real life.'],
strat:['The live bot runs Trend Breakout plus the lab strategies switched on (US 19 + 1 = 20, India 15 + 1 = 16).','A simple funnel: all shares → quick check (above the 200-day average price OR rising over 3 months, enough trading, clean data) → a strategy rule says buy → grouped in 4 families → that strategy\'s stop, target and score → each chosen share tested on its own past → rank.','Own-past check: a strategy offers a share only if, in the last 3 years, it gave at least 3 buy signals on that share, at least half ended higher 20 market days later, and on average they made money. The 10-year test uses it too.','4 families: Breakout / new high (10 strategies), Steady uptrend (3), Momentum leader (6), Dip in an uptrend (2).','Order = the order in the settings file (best 10-year lab result first). Trend Breakout is last.','Fear Pullback: India only. Mean Reversion, Clenow TF, SEPA, Turtle S2, Weekly Rotation: US only.','Each share remembers the strategy that bought it; that strategy decides when to sell. The expected range can only move its stop up.','At most 1 share per strategy (up to 5 shares in total), so every strategy gets a turn.','One past-years test for the whole mix per market (not one per strategy).','Strategy table: one-by-one lab tests, checked against the saved research results (9 Oct 2026).','Planned: 4 layers (market check, share check, buy signal, sell rule). Not built yet.'],
data:['A price top-up never deletes a saved day: new bars replace the same days, a day the source leaves out stays (Yahoo sometimes drops the day before for Indian shares while the market is open), a day without a close is ignored. If most shares have no price for the day of the Run, the Run stops with a reason, trades nothing and keeps the day open for a later Run.','Prices: Yahoo Finance (free, can be up to 15 minutes late). A Run downloads only when a new day waits; the past-years test downloads 10 years; live prices come every 60 s straight into the website part and are not saved.','The two searches read the prices and the account side by side; what they find is saved in a last-Run file for the page. Every 5 min (market open) the website part looks again on live prices.','The expected range is saved with each held share in the account and scaled on a split.','Saved on your PC: the data folder (prices, shared), the practice account file (one per profile, one for the time machine), the runs folder (reports, saved test, the daily report page).','The state folder also holds the busy file, the last-Run findings and the STOP switch of each market. Side-panel settings and the last budget: one settings file per market (the time machine uses its own copy).','Time machine: no downloads and no live prices; the saved prices are cut off after the trip\'s last finished day. Waiting buys there read only that day\'s Open.','The command-line run can send a Telegram message if it is set up.','Your prices and account are never uploaded (only the code is on GitHub). The website works only on this PC (127.0.0.1, port 8050 normally; you use 8060).'],
prof:['Three profiles, no log in: r, p and d (p1, p2, p3). Each has its own account, history, settings, Bot timers, saved test, logs and time machine. Prices are shared.','The picker shows every time you open or refresh the page. Picking the profile already in use changes nothing (also in the time machine).','Switching: the time machine clock is paused first. A run or test still working: refused ("Wait"); the page tries again every 3 s, up to 60 times; the time machine stays paused.','Within about 60 s after a switch, the bot program buys that profile\'s waiting orders and starts its live checks.','Reset of the profile in use: first everything stops (time machine paused, a waiting Run stopped, a running test cancelled, the auto loop starts nothing new; waits up to 90 s, else "Could not stop everything in time ... Press Reset again"). Then it leaves the time machine and wipes. Keeps the STOP switches and the research. A file another program has open: "Close it and press Reset again"; pressing it again finishes.','Time machine: a whole world. You pick the start day and, if you like, the start hour and minute in market time (New York or India time; Time now = the time it is now; a wrong time is refused before anything stops). Your settings are copied in; changes stay in the trip; leaving brings your real settings back. Own account, own past-years test (wiped at start, prices only up to its date), own STOP switches. Start, Start again and Leave first stop everything like Reset (up to 90 s; a start day outside the saved prices is refused before anything stops); a switch also makes a new world: a waiting Run stops quietly, the old test is cancelled. Waiting buys are bought at that day\'s opening price; step 4 says "Buying X at today\'s opening price" (market open) or "X buy when the market opens, at the opening price". Leave and Start again ask first.','Settings: wrong numbers are refused; looser numbers are marked. Changed settings make the test out of date, except "Shares held at once" and the pass marks ("Shares per strategy" does make it out of date). Default = the BOT_INSTRUCTIONS numbers (5 shares, 1 per strategy, bad-market No).'],
safe:['Real order: the share\'s own data, then past-years test, account stop (5% fall), STOP switch, day loss, week loss, losing-streak pause, then the market.','Bad price data, a move over 20% or an unfinished day only affects that one share.','"Stop new buys" and "Restart after a 5% halt" are on the main page: side panel, Safety stops; each asks first. The STOP file in the project folder stops every market and profile.','Every trade has a stop. Up to 5 shares at once, at most 1 per strategy; falling market (extra-safe): 1. Banned: buying more of a losing share, borrowed money, selling options, penny stocks, revenge trades, old data; no short selling (project rule).','The expected range only moves a stop up, never down, and never buys or sells. The two searches and the look-again every 5 minutes only look.','The live buy runs the same safety checks as the trading part: STOP switch, halt, day and week loss stop, losing-streak pause; on a special news day the buy is cancelled.']

dark:{user:['#1d2f55','#4a73c9'],flow:['#17372d','#3a9a74'],helper:['#222b38','#5b6677'],check:['#43361a','#b98a22'],ok:['#1a3a20','#3a9a4b'],stop:['#4a2220','#c4504b'],future:['#1a212b','#667082'],run:['#46301a','#d17a2a'],ink:'#e6ebf2',line:'#8b97a9',bg:'#18202b'}};
const q=t=>String(t).replace(/&/g,'#amp;').replace(/"/g,'#quot;').replace(/</g,'#lt;').replace(/>/g,'#gt;');
function shapeDef(nd){const t=q((LBL[nd.id]?LBL[nd.id]+' · ':'')+nd.title),id=nd.id;
 switch(nd.t){case'term':return `${id}(["${t}"])`;case'io':return `${id}[/"${t}"/]`;case'proc':return `${id}["${t}"]`;case'dec':return `${id}{"${t}"}`;
 case'conn':return `${id}(["${t}"])`;case'off':return `${id}@{ shape: notch-pent, label: "${t}" }`;default:return `${id}[("${t}")]`}}
function mmCode(m,dir){
 const p=PAL[isDark()?'dark':'light'],L=[`flowchart ${dir}`];
 if(m.lanes){m.lanes.forEach((ln,i)=>{L.push(`subgraph L${i}["${ln}"]`);m.nodes.filter(n=>n.c===i).forEach(n=>L.push('  '+shapeDef(n)));L.push('end')})}
 else m.nodes.forEach(n=>L.push(shapeDef(n)));
 VE.forEach(e=>L.push(e[2]?`${e[0]} -->|"${q(e[2])}"| ${e[1]}`:`${e[0]} --> ${e[1]}`));
 Object.keys(KN).forEach(k=>L.push(`classDef k_${k} fill:${p[k][0]},stroke:${p[k][1]},stroke-width:2px,color:${p.ink}${k==='future'?',stroke-dasharray:6 4':''}`));
 m.nodes.forEach(n=>L.push(`class ${n.id} k_${n.kind}`));
 return L.join('\n');

const SYMS=[['⬭','Start / End'],['▱','Input / output'],['▭','Action / process'],['◇','Decision, 2+ outcomes (Yes / No)'],['◯','On-page tag (same letter = jump)'],['⬠','Link to another chart (click to open)'],['⛁','Saved data'],['→','Flow line']];
const WORDS=[['The amount risked (R)','the money lost if the stop is hit (risk 25, win 50 = won 2 × the amount risked, "+2R")'],['Normal daily move (ATR)','how much the share usually moves in one day'],['Stop','a sell price under today\'s price that limits the loss'],['Target','a sell price above the buy price that takes the profit'],['200-day average price','the average closing price of the last 200 market days'],['Quick check','above the 200-day average price, or rising over 3 months, with enough trading and clean data'],['Expected range','where the bot expects a held share to be in the next 5 market days'],['Profit factor (PF)','money won for every 1 lost (money won ÷ money lost)'],['Biggest drop from the top','how far the money fell from its highest point'],['Stop moved to the buy price','after a rise, the worst case is about zero loss'],['Stop that follows the price up','the stop rises with the price and never goes down'],['Market mood','Good, Normal or Bad, from the index and the fear gauge'],['Fear gauge','VIX (US) or India VIX: how nervous the market is'],['Past-years test','the whole strategy mix tested on 10 years of old prices; must pass before new buys'],['Backtest','a test on old prices'],['Limit buy','buy only at or under a set price'],['Account stop (halt)','after a 5% fall from the top, nothing new is bought until you restart'],['Time machine','a practice trip back to a past day'],['Bot program (server)','the part that runs on your PC and keeps watching, even with the page closed'],['Session','one market day'],['Bot timers','how often the bot program wakes and checks (default loop 60 s); you can change them in the side panel']];
const STATES=[['blue','Blue outline = selected / current step'],['green','Green outline = step already done'],['yellow','Yellow = decision or check'],['red','Red = blocked or risk'],['grey','Faded = step not reached yet']];
/* step order: follow the flow from Start; branches in the order they appear */
function buildSteps(){
 const by=M.byId,start=(M.nodes.find(x=>x.start)||M.nodes[0]).id,seen=new Set(),ord=[],qu=[start];
 while(qu.length){const id=qu.shift();if(seen.has(id)||!by[id])continue;seen.add(id);ord.push(id);if(by[id].jump)qu.unshift(by[id].jump);M.edges.filter(e=>e[0]===id).forEach(e=>qu.push(e[1]))}
 M.nodes.forEach(n=>{if(!seen.has(n.id))ord.push(n.id)});
 STEPS=ord.map(id=>by[id]).filter(n=>n.t!=='conn'&&n.t!=='off');
 /* labels in reading order of the chart grid: top to bottom, then left to right (links and loop circles get none) */
 LBL={};M.nodes.map((nd,i)=>[nd,i]).filter(([nd])=>nd.t!=='conn'&&nd.t!=='off').sort((a,b)=>a[0].r-b[0].r||a[0].c-b[0].c||a[1]-b[1]).forEach(([nd],i)=>LBL[nd.id]=(cur+1)+'.'+(i+1));
}
function goLabel(k){const id=Object.keys(LBL).find(x=>LBL[x]===(cur+1)+'.'+k);if(!id)return false;
 if(mode==='step')goStep(STEPS.findIndex(nd=>nd.id===id));else{tr=null;sel=id;paint();panelOverview();focusNode(id,'center')}return true}
const outs=id=>M.edges.filter(e=>e[0]===id);
const realTarget=id=>{let n=M.byId[id],g=0;while(n&&n.jump&&g++<5){const o=outs(n.jump)[0];n=o?M.byId[o[1]]:n}return n};
function resultsHTML(nd){
 const o=outs(nd.id);if(!o.length)return nd.t==='term'?'<p>This is the end of this flow.</p>':(nd.goto?'<p>The flow continues in another chart.</p>':'<p>No further step.</p>');
 return o.map(e=>{const t=realTarget(e[1]);const lab=e[2]||'Next';const c=/^yes/i.test(lab)?'green':/^no/i.test(lab)?'red':'blue';return `<div class="res"><span class="chip ${c}">${esc(lab)}</span><span>${t&&LBL[t.id]?`<b>${LBL[t.id]}</b> `:''}${esc(t?t.title:e[1])}</span></div>`}).join('');
}
function nodeKindChip(nd){const k={term:'Start / End',io:'Input / output',proc:'Action',dec:'Decision',conn:'Connector',off:'Link to another chart',store:'Saved data'}[nd.t];const c=nd.t==='dec'?'yellow':nd.kind==='stop'?'red':nd.kind==='ok'?'green':'';return `<span class="chip ${c}">${k}</span>`}
function detailBlocks(nd,full){
 const d=nd.d||{};let h='';
 if(d.say)h+=`<div class="blk"><h4>${full?'What happens':'In simple words'}</h4><p>${d.say}</p></div>`;
 if(nd.t==='dec')h+=`<div class="blk"><h4>Decision</h4><p>${esc(nd.title)}</p></div>`;
 h+=`<div class="blk"><h4>${nd.t==='dec'?'Possible results':'What happens next'}</h4>${resultsHTML(nd)}</div>`;
 if(d.points&&d.points.length)h+=`<div class="blk"><h4>${full?'Why it matters / details':'Details'}</h4><ul>${d.points.slice(0,full?3:9).map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
 if(d.nums&&d.nums.length)h+=`<div class="blk"><h4>Numbers</h4><table class="nums">${d.nums.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('')}</table></div>`;
 if(d.code)h+=`<div class="blk"><h4>Where in the project</h4><code>${d.code}</code></div>`;
 if(nd.goto){const t=MAPS.findIndex(m=>m.id===nd.goto);h+=`<button type="button" class="pbtn" id="op">Open chart: ${MAPS[t].tab}</button>`}
 return h;
}

function bindOpen(nd){const b=$('#op');if(b)b.onclick=()=>{cur=MAPS.findIndex(m=>m.id===nd.goto);dirOverride=null;sel=null;render()}}
function panelOverview(){
 if(!sel){$('#panel').innerHTML=`<span class="chip blue">Overview</span><h3>${esc(M.title)}</h3><p>${esc(M.intro)}</p>${factsHTML(true)}<p class="hint">Click any box to learn more. Each box has a label, like ${cur+1}.5, so you can point to that step. Type a label in "Go to" to jump to it. Scroll to zoom, drag to move.</p>`;return}
 const nd=M.byId[sel];
 $('#panel').innerHTML=`${lb(nd.id)}${nodeKindChip(nd)}<h3>${esc(nd.title)}</h3>${detailBlocks(nd,false)}<p class="hint"><a href="#" id="bk">&larr; Back to key facts</a></p>`;
 $('#bk').onclick=e=>{e.preventDefault();sel=null;paint();panelOverview()};bindOpen(nd);
}
function panelStep(){
 const nd=STEPS[stepI];if(!nd)return;
 $('#panel').innerHTML=`${lb(nd.id)}<span class="chip blue">Step ${stepI+1} of ${STEPS.length}</span>${nodeKindChip(nd)}<h3>${esc(nd.title)}</h3>${detailBlocks(nd,true)}${factsHTML(false)}`;bindOpen(nd);
}
function stepNav(){
 const n=$('#stepnav');n.hidden=mode!=='step';if(mode!=='step')return;
 n.innerHTML=`<button type="button" class="btn" id="sp"${stepI===0?' disabled':''}>&larr; Previous</button><span class="lab">${LBL[STEPS[stepI].id]} · step ${stepI+1} of ${STEPS.length}</span><span class="nm">${esc(STEPS[stepI].title)}</span><button type="button" class="btn go" id="sn"${stepI===STEPS.length-1?' disabled':''}>Next &rarr;</button>`;
 $('#sp').onclick=()=>goStep(stepI-1);$('#sn').onclick=()=>goStep(stepI+1);
}
function goStep(i){if(i<0||i>=STEPS.length)return;stepI=i;sel=null;paint();panelStep();stepNav();focusNode(STEPS[i].id,'center')}
function setMode(m){mode=m;sel=null;tr=null;stepI=0;renderBar();paint();if(m==='step'){panelStep();stepNav();focusNode(STEPS[0].id,'center')}else{stepNav();panelOverview();resetView(true)}}
function paint(){
 const svg=$('#canvas svg');if(!svg)return;const idx={};STEPS.forEach((n,i)=>idx[n.id]=i);
 svg.querySelectorAll('g.node').forEach(g=>{const id=g.dataset.id,i=idx[id],st=mode==='step'&&i!==undefined;
  g.classList.toggle('sel',mode==='overview'&&id===sel);g.classList.toggle('active',st&&i===stepI);g.classList.toggle('done',st&&i<stepI);g.classList.toggle('todo',st&&i>stepI);
  g.classList.toggle('vis',!!tr&&tr.path.includes(id));g.classList.toggle('cur',!!tr&&tr.path[tr.path.length-1]===id)});
 svg.querySelectorAll('path.flowchart-link').forEach((el,i)=>{const e=VE[i];el.classList.toggle('used',!!(tr&&e&&tr.edges.includes(e[0]+'>'+e[1])))});
}
function nodeEl(id){return document.querySelector(`#canvas g.node[data-id="${id}"]`)}
let NPOS={};
function viewTo(id,sx,sy){            /* put the centre of node `id` at (sx,sy) inside the chart box */
 const c=NPOS[id];if(!pz||!c)return;const real=pz.getSizes().realZoom;pz.pan({x:sx-real*c.x,y:sy-real*c.y});
}
function focusNode(id,how){
 if(!pz||!NPOS[id])return;const svg=$('#canvas svg'),W=svg.clientWidth,H=svg.clientHeight;
 if(how==='start')return viewTo(id,W/2,58);
 if(how==='center'){const real=pz.getSizes().realZoom;if(real<STEPZ)pz.zoom(pz.getZoom()*STEPZ/real);return viewTo(id,W/2,(H-64)/2)}
 const c=NPOS[id],real=pz.getSizes().realZoom,p=pz.getPan(),x=p.x+real*c.x,y=p.y+real*c.y,m=60;
 let nx=x,ny=y;if(x<m)nx=m;else if(x>W-m)nx=W-m;if(y<m)ny=m;else if(y>H-m)ny=H-m;
 if(nx!==x||ny!==y)viewTo(id,nx,ny);
}
function setNote(t){const n=$('#note');n.hidden=!t;n.textContent=t||''}
function resetView(readable){
 if(!pz)return;pz.resize();pz.fit();pz.center();setNote('');
 if(!readable)return;
 const real=pz.getSizes().realZoom;
 if(real<MINS){pz.zoom(pz.getZoom()*MINS/real);focusNode((M.nodes.find(x=>x.start)||M.nodes[0]).id,'start');setNote('Zoomed in a little so the text stays readable. Drag to move, or press Fit all.')}
}
function renderBar(){
 const dir=dirOverride||M.dir||CHDIR;
 $('#bar').innerHTML=`<h2>${esc(M.title)}</h2><span class="why" title="${esc(M.intro)}">${esc(M.intro)}</span>
 <span class="seg" role="group" aria-label="Mode"><button type="button" id="m-o" class="${mode==='overview'?'on':''}">Overview</button><button type="button" id="m-s" class="${mode==='step'?'on':''}">Step by step</button></span>
 <input id="goto" class="goto" type="text" inputmode="decimal" placeholder="Go to ${cur+1}.5" aria-label="Go to a step label, for example ${cur+1}.5" title="Type a label like ${cur+1}.5 (chart ${cur+1}, box 5) and press Enter">
 <button type="button" class="btn" id="b-key">Symbols</button><button type="button" class="btn" id="b-dir">${dir==='LR'?'Left to right':'Top to bottom'}</button>${M.extra?'<button type="button" class="btn" id="b-tab">Strategy table</button>':''}
 ${mode==='overview'?`<span id="trace" style="display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap"><button type="button" class="btn" id="t-go">Trace Yes / No</button><span id="t-info" class="note2"></span><span id="t-btns"></span><button type="button" class="btn" id="t-back" hidden>Back</button><button type="button" class="btn" id="t-reset" hidden>Reset</button></span>`:''}
 <button type="button" class="btn" id="b-pan" title="Show or hide the details panel">${$('#main').classList.contains('collapsed')?'Show details':'Hide details'}</button>
 <div class="pop" id="pop" hidden><div class="row">${SYMS.map(x=>`<span><b>${x[0]}</b> ${x[1]}</span>`).join('')}</div><div class="row">${STATES.map(x=>`<span><span class="chip ${x[0]==='grey'?'':x[0]}">${x[1]}</span></span>`).join('')}</div><div class="row">${Object.keys(KN).map(k=>`<span><b style="color:${PAL[isDark()?'dark':'light'][k][1]}">■</b> ${KN[k]}</span>`).join('')}</div><div class="row"><span><span class="chip lbl">${cur+1}.5</span> Label = chart ${cur+1}, box 5, counted top to bottom, then left to right</span></div><div class="row">${WORDS.map(x=>`<span><b>${x[0]}</b> = ${x[1]}</span>`).join('')}</div></div>`;
 $('#m-o').onclick=()=>mode!=='overview'&&setMode('overview');$('#m-s').onclick=()=>mode!=='step'&&setMode('step');
 $('#b-key').onclick=()=>{const x=$('#pop');x.hidden=!x.hidden};
 const gi=$('#goto');gi.onkeydown=e=>{if(e.key!=='Enter')return;
  const m=/^\s*(?:(\d+)\s*[.,-]\s*)?(\d+)\s*$/.exec(gi.value),c=m&&m[1]?+m[1]-1:cur,k=m?+m[2]:0;
  if(!m||!MAPS[c]){gi.select();return}
  if(c!==cur){cur=c;dirOverride=null;sel=null;stepI=0;GOTO=k;render();return}
  if(!goLabel(k))gi.select()};
 $('#b-dir').onclick=()=>{dirOverride=dir==='LR'?'TB':'LR';render()};
 $('#b-pan').onclick=()=>{$('#main').classList.toggle('collapsed');renderBar();setTimeout(()=>{resetView(true);if(mode==='step'&&STEPS[stepI])focusNode(STEPS[stepI].id,'center')},80)};
 const bt=$('#b-tab');if(bt)bt.onclick=()=>{$('#mbox').innerHTML=M.extra()+'<p><button type="button" id="mx" class="pbtn">Close</button></p>';$('#modal').style.display='flex';$('#mx').onclick=()=>{$('#modal').style.display='none'}};
 const tg=$('#t-go');if(tg){tg.onclick=traceStart;$('#t-back').onclick=traceBack;$('#t-reset').onclick=()=>{tr=null;paint();$('#t-info').textContent='';$('#t-btns').innerHTML='';$('#t-back').hidden=$('#t-reset').hidden=true}}
}
function svgSize(svg){
 const t=document.createElement('div');t.style.cssText='position:absolute;left:-99999px;top:0;visibility:hidden';t.innerHTML=svg;document.body.appendChild(t);
 let w=1000,h=1000;try{const e=t.querySelector('svg'),b=e.getBBox();w=b.width+40;h=b.height+40}catch(x){}
 t.remove();return [w,h]}
async function render(){
 const my=++token;M=MAPS[cur];M.byId={};M.nodes.forEach(n=>M.byId[n.id]=n);
 VE=M.edges.filter(e=>M.byId[e[0]]&&M.byId[e[1]]);buildSteps();tr=null;if(sel&&!M.byId[sel])sel=null;if(stepI>=STEPS.length)stepI=0;
 const p=PAL[isDark()?'dark':'light'];
 $('#tabs').innerHTML=MAPS.map((m,i)=>`<button type="button" role="tab" aria-selected="${i===cur}" data-i="${i}">${m.tab}</button>`).join('');
 document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;dirOverride=null;sel=null;stepI=0;render()});
 const act=$('#tabs button[aria-selected="true"]');if(act)act.scrollIntoView({inline:'center',block:'nearest'});
 $('#zoom').innerHTML='<button type="button" class="btn" id="z-in" aria-label="Zoom in">+</button><button type="button" class="btn" id="z-out" aria-label="Zoom out">&minus;</button><button type="button" class="btn" id="z-fit">Fit all</button><button type="button" class="btn" id="z-rs">Reset view</button>';
 $('#z-in').onclick=()=>pz&&pz.zoomIn();$('#z-out').onclick=()=>pz&&pz.zoomOut();$('#z-fit').onclick=()=>{resetView(false)};$('#z-rs').onclick=()=>{resetView(true);if(mode==='step'&&STEPS[stepI])focusNode(STEPS[stepI].id,'center')};
 mermaid.initialize({startOnLoad:false,securityLevel:'loose',theme:'base',flowchart:{curve:'linear',htmlLabels:true,useMaxWidth:false,nodeSpacing:18,rankSpacing:22,padding:5,wrappingWidth:150},
  themeVariables:{fontSize:'14px',lineColor:p.line,primaryTextColor:p.ink,edgeLabelBackground:p.bg,tertiaryColor:p.bg,clusterBkg:isDark()?'#10151c':'#f5f6f8',clusterBorder:p.line}});
 const st=$('.stage'),cw=st.clientWidth||900,ch=st.clientHeight||600;
 const dirs=dirOverride?[dirOverride]:M.dir?[M.dir]:['TB','LR'];
 try{
  let best=null;
  for(const d of dirs){const r=await mermaid.render('mm'+my+d,mmCode(M,d));if(my!==token)return;const [w,h]=svgSize(r.svg),sc=Math.min(cw/w,ch/h);if(!best||sc>best.sc)best={svg:r.svg,d,sc}}
  CHDIR=best.d;document.querySelectorAll('body > [id^="dmm"], body > svg[id^="mm"], body > div > svg[id^="mm"]').forEach(e=>e.remove());
  if(pz){try{pz.destroy()}catch(e){}pz=null}
  $('#canvas').innerHTML=best.svg;const svg=$('#canvas svg');svg.removeAttribute('style');svg.setAttribute('width','100%');svg.setAttribute('height','100%');svg.style.maxWidth='none';
  svg.querySelectorAll('g.node').forEach(g=>{const m=/flowchart-(.+)-\d+$/.exec(g.id||'');if(!m)return;g.dataset.id=m[1];g.onclick=ev=>{ev.stopPropagation();onNode(m[1])}});
  NPOS={};svg.querySelectorAll('g.node').forEach(g=>{const id=g.dataset.id;if(!id)return;const m=svg.getScreenCTM().inverse().multiply(g.getScreenCTM()),bb=g.getBBox();NPOS[id]={x:m.e+m.a*(bb.x+bb.width/2),y:m.f+m.d*(bb.y+bb.height/2)}});
  pz=svgPanZoom(svg,{zoomScaleSensitivity:.3,minZoom:.1,maxZoom:10,fit:true,center:true,dblClickZoomEnabled:false,controlIconsEnabled:false});
 }catch(e){$('#canvas').innerHTML='<p style="padding:20px;color:var(--mute)">Could not draw this chart: '+esc(e.message||e)+'</p>';renderBar();return}
 renderBar();paint();
 if(mode==='step'){panelStep();stepNav()}else{stepNav();panelOverview()}
 resetView(mode==='overview');
 if(mode==='step')focusNode(STEPS[stepI].id,'center');
 if(GOTO){const k=GOTO;GOTO=null;goLabel(k)}
}
function onNode(id){
 if(mode==='step'){const i=STEPS.findIndex(n=>n.id===id);if(i>=0)goStep(i);else{const n=realTarget(id);if(n){const j=STEPS.findIndex(x=>x.id===n.id);if(j>=0)goStep(j)}}return}
 sel=id;paint();panelOverview();
}
/* optional Yes / No trace (overview only) */
function traceStart(){const s0=M.nodes.find(x=>x.start)||M.nodes[0];tr={path:[s0.id],edges:[]};traceShow()}
function traceGo(e){tr.edges.push(e[0]+'>'+e[1]);tr.path.push(e[1]);const t=M.byId[e[1]];if(t.jump)tr.path.push(t.jump);traceShow()}
function traceBack(){if(!tr||tr.path.length<2)return;const l=M.byId[tr.path[tr.path.length-1]];tr.path.pop();if(M.byId[tr.path[tr.path.length-1]].jump===l.id)tr.path.pop();tr.edges.pop();traceShow()}
function traceShow(){
 const id=tr.path[tr.path.length-1],nd=M.byId[id],o=outs(id);sel=id;paint();panelOverview();focusNode(id,'visible');
 $('#t-back').hidden=$('#t-reset').hidden=false;
 let info=`Step ${tr.path.length}: ${LBL[id]?LBL[id]+' ':''}${nd.title}`,b='';
 if(!o.length){info+=nd.goto?' (continues in another chart)':'  Finished.';if(nd.goto)b='<button type="button" class="btn go" id="t-open">Open next chart</button>'}
 else if(nd.t==='dec'){info+='  Your answer?';b=o.map((e,i)=>`<button type="button" class="btn go" data-i="${i}">${e[2]||'Next'}</button>`).join(' ')}
 else b=o.map((e,i)=>`<button type="button" class="btn go" data-i="${i}">${e[2]||'Next'}</button>`).join(' ');
 $('#t-info').textContent=info;$('#t-btns').innerHTML=b;
 document.querySelectorAll('#t-btns button[data-i]').forEach(x=>x.onclick=()=>traceGo(o[+x.dataset.i]));
 const op=$('#t-open');if(op)op.onclick=()=>{cur=MAPS.findIndex(m=>m.id===nd.goto);dirOverride=null;render()};
}
$('#theme').onclick=()=>{const r=document.documentElement;r.dataset.theme=isDark()?'light':'dark';render()};
addEventListener('resize',()=>{clearTimeout(window.__rz);window.__rz=setTimeout(()=>{resetView(true);if(mode==='step'&&STEPS[stepI])focusNode(STEPS[stepI].id,'center')},150)});
addEventListener('keydown',e=>{if(mode!=='step'||/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')goStep(stepI+1);else if(e.key==='ArrowLeft')goStep(stepI-1)});
render();
</script>
</body>
